services:
  # 1. Aplikasi Utama (PHP 8.2-FPM + Python 3.10 + Tesseract OCR)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistikku_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/python/.venv
    environment:
      APP_NAME: LogistikKu
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: logistikku
      DB_USERNAME: logistikku_user
      DB_PASSWORD: logistikku_secret
      QUEUE_CONNECTION: database
      PYTHON_EXECUTABLE: /var/www/python/.venv/bin/python
    depends_on:
      db:
        condition: service_healthy
    networks:
      - logistikku_net

  # 2. Web Server (Nginx Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: logistikku_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - logistikku_net

  # 3. Database MySQL 8.0
  db:
    image: mysql:8.0
    container_name: logistikku_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: logistikku
      MYSQL_USER: logistikku_user
      MYSQL_PASSWORD: logistikku_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "logistikku_user", "-plogistikku_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - logistikku_net

  # 4. Background Queue Worker (Prediksi Stok & Verifikasi OCR)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistikku_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work database --queue=stock-predictions,default --sleep=1 --tries=3 --timeout=300
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/python/.venv
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: logistikku
      DB_USERNAME: logistikku_user
      DB_PASSWORD: logistikku_secret
      QUEUE_CONNECTION: database
      PYTHON_EXECUTABLE: /var/www/python/.venv/bin/python
    depends_on:
      - app
      - db
    networks:
      - logistikku_net

volumes:
  db_data:
    driver: local

networks:
  logistikku_net:
    driver: bridge

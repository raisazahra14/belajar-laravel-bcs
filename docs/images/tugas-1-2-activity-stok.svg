<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Activity Diagram Transaksi Stok LogistikKu</title>
  <desc id="desc">Alur stok masuk keluar, transfer, reversal, audit, dan prediksi.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#697086"/></marker><style>.bg{fill:#f7f8fc}.head{fill:#353687}.box{fill:#fff;stroke:#cfd4e5;stroke-width:2}.ok{fill:#edf9f1;stroke:#2e9a58}.bad{fill:#fff1f2;stroke:#dc3545}.dec{fill:#fff8e8;stroke:#d88b16;stroke-width:2}.line{stroke:#697086;stroke-width:2;fill:none;marker-end:url(#a)}.h{font:700 30px Arial;fill:#fff}.t{font:700 18px Arial;fill:#20263d}.p{font:15px Arial;fill:#4f566b}.small{font:13px Arial;fill:#6d7387}</style></defs>
  <rect class="bg" width="1200" height="900"/><rect class="head" width="1200" height="82"/><text class="h" x="45" y="52">Activity Stok, Transfer, dan Reversal</text>
  <rect class="box" x="410" y="115" rx="14" width="380" height="70"/><text class="t" x="600" y="145" text-anchor="middle">Pilih barang dan aksi</text><text class="p" x="600" y="168" text-anchor="middle">Masuk/keluar • Transfer • Reversal</text>
  <path class="line" d="M600 185V230"/><polygon class="dec" points="600,225 760,305 600,385 440,305"/><text class="t" x="600" y="297" text-anchor="middle">Input dan akses</text><text class="p" x="600" y="321" text-anchor="middle">valid, saldo cukup?</text>
  <path class="line" d="M440 305H250V405"/><text class="small" x="330" y="292">Tidak</text><rect class="bad" x="80" y="405" rx="14" width="340" height="72"/><text class="t" x="250" y="435" text-anchor="middle">Batalkan perubahan</text><text class="p" x="250" y="459" text-anchor="middle">Tampilkan pesan yang aman</text>
  <path class="line" d="M600 385V430"/><text class="small" x="616" y="410">Ya</text><rect class="box" x="410" y="430" rx="14" width="380" height="72"/><text class="t" x="600" y="459" text-anchor="middle">Mulai transaction dan lock</text><text class="p" x="600" y="482" text-anchor="middle">Barang serta saldo gudang terkait</text>
  <path class="line" d="M600 502V545"/><rect class="box" x="410" y="545" rx="14" width="380" height="88"/><text class="t" x="600" y="574" text-anchor="middle">Perbarui saldo dan ledger</text><text class="p" x="600" y="598" text-anchor="middle">Transfer membuat dua baris; reversal</text><text class="p" x="600" y="619" text-anchor="middle">membuat transaksi lawan</text>
  <path class="line" d="M600 633V675"/><rect class="box" x="410" y="675" rx="14" width="380" height="72"/><text class="t" x="600" y="705" text-anchor="middle">Simpan audit transaksi</text><text class="p" x="600" y="729" text-anchor="middle">Snapshot, referensi, harga, pelaku</text>
  <path class="line" d="M600 747V790"/><rect class="ok" x="350" y="790" rx="14" width="500" height="72"/><text class="t" x="600" y="820" text-anchor="middle">Commit dan jadwalkan prediksi</text><text class="p" x="600" y="844" text-anchor="middle">Tampilkan saldo, histori, laporan, dan notifikasi</text>
</svg>

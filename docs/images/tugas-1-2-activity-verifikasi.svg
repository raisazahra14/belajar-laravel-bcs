<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Activity Diagram Verifikasi Dokumen LogistikKu</title>
  <desc id="desc">Alur upload privat, queue, OCR Python, hasil, audit, dan notifikasi.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#697086"/></marker><style>.bg{fill:#f7f8fc}.head{fill:#353687}.box{fill:#fff;stroke:#cfd4e5;stroke-width:2}.py{fill:#eef7ff;stroke:#3576b8;stroke-width:2}.ok{fill:#edf9f1;stroke:#2e9a58}.bad{fill:#fff1f2;stroke:#dc3545}.line{stroke:#697086;stroke-width:2;fill:none;marker-end:url(#a)}.h{font:700 30px Arial;fill:#fff}.t{font:700 17px Arial;fill:#20263d}.p{font:14px Arial;fill:#4f566b}</style></defs>
  <rect class="bg" width="1200" height="820"/><rect class="head" width="1200" height="82"/><text class="h" x="45" y="52">Activity Verifikasi Dokumen Laravel–Python</text>
  <rect class="box" x="380" y="110" rx="14" width="440" height="66"/><text class="t" x="600" y="138" text-anchor="middle">Upload PDF/JPG/JPEG/PNG dan pilih jenis</text><text class="p" x="600" y="160" text-anchor="middle">Surat Jalan • Invoice • Bukti Fisik</text>
  <path class="line" d="M600 176V215"/><rect class="box" x="380" y="215" rx="14" width="440" height="66"/><text class="t" x="600" y="243" text-anchor="middle">Validasi dan simpan file privat</text><text class="p" x="600" y="265" text-anchor="middle">Buat record berstatus menunggu</text>
  <path class="line" d="M600 281V320"/><rect class="box" x="380" y="320" rx="14" width="440" height="66"/><text class="t" x="600" y="348" text-anchor="middle">Queue default menjalankan job</text><text class="p" x="600" y="370" text-anchor="middle">Status berubah menjadi diproses</text>
  <path class="line" d="M600 386V425"/><rect class="py" x="340" y="425" rx="14" width="520" height="82"/><text class="t" x="600" y="454" text-anchor="middle">Python, Tesseract, OpenCV, PyMuPDF</text><text class="p" x="600" y="478" text-anchor="middle">OCR, metadata, skor, pemeriksaan visual</text><text class="p" x="600" y="498" text-anchor="middle">Kembalikan kontrak JSON ke Laravel</text>
  <path class="line" d="M600 507V550"/><path class="line" d="M600 550H285V605"/><path class="line" d="M600 550H915V605"/>
  <rect class="ok" x="80" y="605" rx="14" width="410" height="92"/><text class="t" x="285" y="635" text-anchor="middle">Hasil valid: selesai</text><text class="p" x="285" y="659" text-anchor="middle">Simpan OCR, metadata, skor, audit</text><text class="p" x="285" y="680" text-anchor="middle">Koreksi/reprocess tersedia</text>
  <rect class="bad" x="710" y="605" rx="14" width="410" height="92"/><text class="t" x="915" y="635" text-anchor="middle">Gagal/timeout: gagal</text><text class="p" x="915" y="659" text-anchor="middle">Simpan pesan aman dan audit</text><text class="p" x="915" y="680" text-anchor="middle">Retry tersedia bila file masih ada</text>
  <path class="line" d="M285 697V748H600"/><path class="line" d="M915 697V748H600"/><rect class="box" x="410" y="725" rx="14" width="380" height="66"/><text class="t" x="600" y="754" text-anchor="middle">Kirim notifikasi ke pemilik</text><text class="p" x="600" y="777" text-anchor="middle">Admin dapat melihat semua hasil</text>
</svg>

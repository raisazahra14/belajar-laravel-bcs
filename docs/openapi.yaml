    Unauthorized401:
      description: "HTTP 401 Unauthorized — Token Bearer tidak dikirim, tidak valid, sudah dicabut, kedaluwarsa, atau kredensial login salah."
      headers:
        X-API-Version:
          $ref: "#/components/headers/XApiVersion"
        X-Content-Type-Options:
          $ref: "#/components/headers/XContentTypeOptions"
        X-Frame-Options:
          $ref: "#/components/headers/XFrameOptions"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            TokenMissingOrInvalid:
              summary: "Token tidak ada / dicabut / kedaluwarsa"
              value:
                success: false
                message: "Autentikasi diperlukan atau token tidak valid."
                errors: {}
                code: "UNAUTHENTICATED"
            InvalidCredentials:
              summary: "Email atau password salah pada login"
              value:
                success: false
                message: "Kredensial yang diberikan tidak cocok."
                errors: {}
                code: "UNAUTHENTICATED"

    Forbidden403:
      description: "HTTP 403 Forbidden — Token valid tetapi tidak memiliki `ability` yang disyaratkan atau role pengguna tidak berwenang."
      headers:
        X-API-Version:
          $ref: "#/components/headers/XApiVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Token akses tidak memiliki izin (ability) yang diperlukan untuk endpoint ini."
            errors: {}
            code: "FORBIDDEN"

    NotFound404:
      description: "HTTP 404 Not Found — Resource ID atau endpoint API yang diminta tidak ditemukan."
      headers:
        X-API-Version:
          $ref: "#/components/headers/XApiVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Data atau endpoint API yang diminta tidak ditemukan."
            errors: {}
            code: "RESOURCE_NOT_FOUND"

    Conflict409:
      description: "HTTP 409 Conflict — Nomor referensi duplikat (idempotency guard), saldo stok tidak mencukupi/konflik, atau deadlock transaksi database."
      headers:
        X-API-Version:
          $ref: "#/components/headers/XApiVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Nomor referensi transaksi sudah pernah diproses sebelumnya."
            errors: {}
            code: "CONFLICT"

    ValidationError422:
      description: "HTTP 422 Unprocessable Content — Kegagalan validasi field payload/query atau pelanggaran aturan bisnis."
      headers:
        X-API-Version:
          $ref: "#/components/headers/XApiVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            FieldValidationError:
              summary: "Validasi field atau query parameter gagal"
              value:
                success: false
                message: "Validasi gagal"
                errors:
                  sort:
                    - "Kolom pengurutan barang tidak valid."
                code: "VALIDATION_ERROR"
            AbilityEscalationRejected:
              summary: "Permintaan scope ability di luar kewenangan role"
              value:
                success: false
                message: "Validasi gagal"
                errors:
                  abilities:
                    - "Role staff tidak diizinkan meminta ability: po:approve."
                code: "VALIDATION_ERROR"

    TooManyRequests429:
      description: "HTTP 429 Too Many Requests — Batas 60 request/menit atau batas 5 percobaan login gagal terlampaui."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfterHeader"
        X-API-Version:
          $ref: "#/components/headers/XApiVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Terlalu banyak permintaan. Silakan coba lagi beberapa saat lagi."
            errors: {}
            code: "TOO_MANY_REQUESTS"

    InternalServerError500:
      description: "HTTP 500 Internal Server Error — Kesalahan internal server (detail exception disamarkan di produksi)."
      headers:
        X-API-Version:
          $ref: "#/components/headers/XApiVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: "Terjadi kesalahan internal pada server."
            errors: {}
            code: "INTERNAL_SERVER_ERROR"
